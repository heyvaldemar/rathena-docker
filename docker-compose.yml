# rAthena — login, char and map servers, their database, and a password page.
#
# The three servers are one program split three ways and they must agree about
# each other's addresses, so they are configured together from .env by
# render-conf.sh rather than by editing four files consistently by hand.
#
# NOTHING PUBLISHES THE DATABASE. mariadb is reachable only on this compose
# network, by the name `db`. rAthena's own tools/docker/ publishes 3306 to the
# host with the password `ragnarok`; that is fine for a laptop and wrong for
# anything reachable from outside.

# Image pins live HERE, as interpolation defaults, so `git pull` delivers the
# combination this repository has tested and nothing has to be set in .env to
# start. Two of the three are built from this checkout, so their defaults name
# the local tag `build:` produces; the database is pulled, so it carries a
# digest.
#
# CI (the Trivy scan and the freshness check) reads the pins from these lines:
# this block is the single source of truth.
x-images:
  rathena: &rathena-image ${RA_IMAGE_TAG:-rathena:prere-20200401-a3.24}
  webpw: &webpw-image ${RA_PW_IMAGE_TAG:-rathena-webpw:1}
  mariadb: &mariadb-image ${RA_DB_IMAGE_TAG:-mariadb:${RA_DB_IMAGE_VERSION:-11.8@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3}}

services:
  db:
    image: *mariadb-image
    container_name: ra-db
    # Docker gives a container ten seconds and then SIGKILL. MariaDB has
    # InnoDB to flush on the way out, and a shard database cut off halfway
    # does crash recovery on the next start - with the world state of a game
    # server behind it. Sixty seconds, overridable in .env.
    stop_grace_period: ${RA_DB_STOP_GRACE_PERIOD:-60s}
    # Resource limits as .env-overridable defaults (e.g. RA_DB_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${RA_DB_MEMORY_LIMIT:-1g}
          cpus: "${RA_DB_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${RA_DB_MEMORY_RESERVATION:-128m}
          cpus: "${RA_DB_CPU_RESERVATION:-0.25}"
    command: ["--skip-name-resolve"]
    environment:
      MARIADB_DATABASE: ${RA_DB_NAME}
      MARIADB_USER: ${RA_DB_USER}
      MARIADB_PASSWORD: ${RA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${RA_DB_ROOT_PASSWORD}
      TZ: ${RA_TIMEZONE}
    volumes:
      - ./data/mysql:/var/lib/mysql
      # The schema is loaded once, on the first start, from the image's own
      # sql-files — see the README. Put them here to have it done for you.
      - ./data/sql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  login:
    image: *rathena-image
    container_name: ra-login
    # Resource limits as .env-overridable defaults (e.g. RA_LOGIN_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${RA_LOGIN_MEMORY_LIMIT:-512m}
          cpus: "${RA_LOGIN_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${RA_LOGIN_MEMORY_RESERVATION:-64m}
          cpus: "${RA_LOGIN_CPU_RESERVATION:-0.25}"
    build: .
    command: ["./login-server"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      TZ: ${RA_TIMEZONE}
    volumes:
      - ./conf-import:/rathena/conf/import:ro
      - ./logs:/rathena/log
    ports: ["6900:6900"]
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q :6900"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  char:
    image: *rathena-image
    container_name: ra-char
    # Resource limits as .env-overridable defaults (e.g. RA_CHAR_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${RA_CHAR_MEMORY_LIMIT:-512m}
          cpus: "${RA_CHAR_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${RA_CHAR_MEMORY_RESERVATION:-64m}
          cpus: "${RA_CHAR_CPU_RESERVATION:-0.25}"
    command: ["./char-server"]
    depends_on:
      login: { condition: service_healthy }
    environment:
      TZ: ${RA_TIMEZONE}
    volumes:
      - ./conf-import:/rathena/conf/import:ro
      - ./logs:/rathena/log
    ports: ["6121:6121"]
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q :6121"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  map:
    image: *rathena-image
    container_name: ra-map
    # Resource limits as .env-overridable defaults (e.g. RA_MAP_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${RA_MAP_MEMORY_LIMIT:-2g}
          cpus: "${RA_MAP_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${RA_MAP_MEMORY_RESERVATION:-256m}
          cpus: "${RA_MAP_CPU_RESERVATION:-0.5}"
    command: ["./map-server"]
    depends_on:
      char: { condition: service_healthy }
    environment:
      TZ: ${RA_TIMEZONE}
    volumes:
      - ./conf-import:/rathena/conf/import:ro
      - ./logs:/rathena/log
    ports: ["5121:5121"]
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q :5121"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Optional. Ragnarok has no in-game password command — all 314 atcommands were
  # checked — so without something like this, players cannot change a password at
  # all and every reset goes through you. See webpw/app.py for why this is not
  # FluxCP.
  webpw:
    image: *webpw-image
    container_name: ra-pw
    # Resource limits as .env-overridable defaults (e.g. RA_PW_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${RA_PW_MEMORY_LIMIT:-256m}
          cpus: "${RA_PW_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${RA_PW_MEMORY_RESERVATION:-32m}
          cpus: "${RA_PW_CPU_RESERVATION:-0.1}"
    build: ./webpw
    depends_on:
      db: { condition: service_healthy }
    environment:
      RA_DB_HOST: db
      RA_DB_USER: ${RA_DB_USER}
      RA_DB_PASSWORD: ${RA_DB_PASSWORD}
      RA_DB_NAME: ${RA_DB_NAME}
      SHARD_NAME: ${RA_SERVER_NAME}
      SITE_URL: ${RA_SITE_URL}
      MIN_PASSWORD_LENGTH: ${RA_PW_MIN_LENGTH}
      RATE_MAX: ${RA_PW_RATE_MAX}
      RATE_WINDOW_SECONDS: ${RA_PW_RATE_WINDOW}
      TZ: ${RA_TIMEZONE}
    # Bound to localhost. Put a reverse proxy or a tunnel in front of it — this
    # page takes passwords, so it has no business being served over plain HTTP.
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=5)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
